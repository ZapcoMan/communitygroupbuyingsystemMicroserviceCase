server:
  port: 8005

spring:
  application:
    name: cgb-content-service
  profiles:
    active: dev

  # ==================== Nacos 配置中心 ====================
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: cgb-dev
        group: CGB_GROUP
        metadata:
          version: 1.0.0
          env: dev
      config:
        namespace: cgb-dev
        group: CGB_GROUP
        file-extension: yml
        shared-configs:
          - data-id: common-redis.yml
            group: SHARED_GROUP
            refresh: true
          - data-id: common-mybatis.yml
            group: SHARED_GROUP
            refresh: true
        refresh-enabled: true
  config:
    import:
      - optional:nacos:cgb-content-service.yml?group=CGB_GROUP&refreshEnabled=true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/cgb_content?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cgb.content.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isdelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.cgb: debug
    com.alibaba.nacos: info

# ==================== RocketMQ 配置 ====================
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: cgb-content-producer-group
    send-message-timeout: 3000
    max-message-size: 4194304
    retry-times-when-send-failed: 2
    retry-next-server: true