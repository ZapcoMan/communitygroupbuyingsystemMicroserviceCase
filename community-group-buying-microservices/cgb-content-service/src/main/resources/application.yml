server:
  port: 8005

spring:
  application:
    name: cgb-content-service
  profiles:
    active: dev

  # ==================== Nacos 配置中心 ====================
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: cgb-dev
        group: CGB_GROUP
        metadata:
          version: 1.0.0
          env: dev
      config:
        namespace: cgb-dev
        group: CGB_GROUP
        file-extension: yml
        shared-configs:
          - data-id: common-redis.yml
            group: SHARED_GROUP
            refresh: true
          - data-id: common-mybatis.yml
            group: SHARED_GROUP
            refresh: true
        refresh-enabled: true
  # 从 Nacos 导入配置（数据源、Redis、RocketMQ、Seata 等敏感配置均在 Nacos 管理）
  config:
    import:
      - optional:nacos:cgb-content-service.yml?group=CGB_GROUP&refreshEnabled=true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cgb.content.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.cgb: debug
    com.alibaba.nacos: info
