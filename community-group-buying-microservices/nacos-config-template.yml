# ==========================================================
# Nacos 配置中心模板
# ==========================================================
# 部署时在 Nacos 控制台创建以下配置：
# 命名空间：cgb-dev
#
# 1. 共享配置
#    data-id: common-redis.yml    group: SHARED_GROUP
#    data-id: common-mybatis.yml  group: SHARED_GROUP
#
# 2. 各服务私有配置
#    data-id: cgb-user-service.yml     group: CGB_GROUP
#    data-id: cgb-product-service.yml  group: CGB_GROUP
#    data-id: cgb-order-service.yml    group: CGB_GROUP
#    data-id: cgb-groupbuy-service.yml group: CGB_GROUP
#    data-id: cgb-content-service.yml  group: CGB_GROUP
#    data-id: cgb-gateway.yml          group: CGB_GROUP
# ==========================================================

# --- common-redis.yml (SHARED_GROUP) ---
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# --- common-mybatis.yml (SHARED_GROUP) ---
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isdelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# --- cgb-user-service.yml (CGB_GROUP) ---
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/cgb_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
jwt:
  secret: ${JWT_SECRET:cgb-community-group-buying-secret-key-2024-change-this-in-production}
  expiration: ${JWT_EXPIRATION:3600}

