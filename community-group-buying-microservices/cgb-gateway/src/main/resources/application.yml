server:
  port: 8000

spring:
  application:
    name: cgb-gateway
  profiles:
    active: dev

  # ==================== Nacos 配置中心 ====================
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: cgb-dev
        group: CGB_GROUP
        metadata:
          version: 1.0.0
          env: dev
      config:
        namespace: cgb-dev
        group: CGB_GROUP
        file-extension: yml
        shared-configs:
          - data-id: common-redis.yml
            group: SHARED_GROUP
            refresh: true
  # 从 Nacos 导入配置（Redis、JWT、限流等敏感配置均在 Nacos 管理）
  config:
    import:
      - optional:nacos:cgb-gateway.yml?group=CGB_GROUP&refreshEnabled=true

  # 云网关配置
  cloud:
    gateway:
      # 全局 CORS
      global-cors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 默认过滤器
      default-filters:
        - name: RequestSize
          args:
            maxSize: 10MB
      # 路由配置
      routes:
        # 用户服务
        - id: cgb-user-service
          uri: lb://cgb-user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        # 商品服务
        - id: cgb-product-service
          uri: lb://cgb-product-service
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        # 团购服务
        - id: cgb-groupbuy-service
          uri: lb://cgb-groupbuy-service
          predicates:
            - Path=/groupbuy/**
          filters:
            - StripPrefix=1
        # 订单服务
        - id: cgb-order-service
          uri: lb://cgb-order-service
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        # 内容服务
        - id: cgb-content-service
          uri: lb://cgb-content-service
          predicates:
            - Path=/content/**
          filters:
            - StripPrefix=1

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: debug
