server:
  port: 8000

spring:
  application:
    name: cgb-gateway
  profiles:
    active: dev

  # ==================== Nacos 配置中心 ====================
  cloud:
    nacos:
      # Nacos 服务器地址
      server-addr: 127.0.0.1:8848
      # 统一命名空间（开发环境）
      discovery:
        namespace: cgb-dev
        group: CGB_GROUP
        # 服务元数据
        metadata:
          version: 1.0.0
          env: dev
      config:
        namespace: cgb-dev
        group: CGB_GROUP
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: common-redis.yml
            group: SHARED_GROUP
            refresh: true
  # 从 Nacos 导入配置
  config:
    import:
      - optional:nacos:cgb-gateway.yml?group=CGB_GROUP&refreshEnabled=true

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 云网关配置（生产环境使用）
  cloud:
    gateway:
      # 全局 CORS
      global-cors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 默认过滤器
      default-filters:
        - name: RequestSize
          args:
            maxSize: 10MB
      # 路由配置
      routes:
        # 用户服务
        - id: cgb-user-service
          uri: lb://cgb-user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        # 商品服务
        - id: cgb-product-service
          uri: lb://cgb-product-service
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        # 团购服务
        - id: cgb-groupbuy-service
          uri: lb://cgb-groupbuy-service
          predicates:
            - Path=/groupbuy/**
          filters:
            - StripPrefix=1
        # 订单服务
        - id: cgb-order-service
          uri: lb://cgb-order-service
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        # 内容服务
        - id: cgb-content-service
          uri: lb://cgb-content-service
          predicates:
            - Path=/content/**
          filters:
            - StripPrefix=1

# JWT 密钥（需替换为实际密钥）
jwt:
  secret: cgb-community-group-buying-secret-key-2024-change-this-in-production
  expiration: 3600

# 限流配置
rate-limit:
  default-count: 100
  default-period: 60

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: debug

# ==================== RocketMQ 配置 ====================
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: cgb-gateway-producer-group
    send-message-timeout: 3000
    max-message-size: 4194304
    retry-times-when-send-failed: 2
    retry-next-server: true

# ==================== Seata 分布式事务配置 ====================
seata:
  application-id: cgb-gateway
  tx-service-group: cgb-gateway-tx-group
  config:
    type: nacos
    nacos:
      namespace: cgb-dev
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      data-id: seataServer.properties
  registry:
    type: nacos
    nacos:
      namespace: cgb-dev
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP